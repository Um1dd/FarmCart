# Free preview service. Database and uploads are temporary on this plan.
services:
  - type: web
    name: farmcart
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: FARMCART_DATA_DIR
        value: /tmp/farmcart
