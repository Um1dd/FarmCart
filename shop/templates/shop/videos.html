<div class="video-grid">{% for video in videos %}<article class="video-card"><video controls playsinline preload="metadata" {% if video.product.image or video.product.image_url %}poster="{{ video.product.picture }}"{% endif %}><source src="{{ video.file.url }}">{{ video.title }}</video><h3>{{ video.title }}</h3><p>{{ video.description }}</p>{% if video.product and video.product.active %}<a class="text-link" href="{% url 'detail' video.product.pk %}">{{ t.view }} <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14"/></svg></a>{% endif %}</article>{% empty %}<div class="video-empty"><span>▷</span><p>{{ t.no_video }}</p></div>{% endfor %}</div>
