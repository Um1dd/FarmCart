{% extends 'shop/base.html' %}{% block content %}<section class="section narrow"><div class="eyebrow">{{ t.account }} · {{ request.user.username }}</div><h1 class="page-title">{{ t.profile }}</h1><form class="profile-form" method="post">{% csrf_token %}<label>{{ t.first_name }}<input name="first_name" maxlength="150" value="{{ request.user.first_name }}"></label><label>{{ t.last_name }}<input name="last_name" maxlength="150" value="{{ request.user.last_name }}"></label><label>{{ t.email }}{% if request.user.is_staff %}<input type="email" value="{{ request.user.email }}" readonly>{% else %}<input type="email" name="email" value="{{ request.user.email }}">{% endif %}</label><button class="button">{{ t.save }} <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14"/></svg></button></form><form class="logout-form" method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="text-link">{{ t.logout }}</button></form></section>{% endblock %}
